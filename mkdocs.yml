site_name: Cloud Native Dojo
site_description: Practical Cloud Native Command and Operations Reference
repo_url: https://github.com/mas2020/cloud-native-dojo
repo_name: cloud-native-dojo

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md

